# The infrastructure this project talks to, for running locally without an AWS account.
#
# The application is deliberately not in here. It runs on the host, where `tsx watch`
# gives it a reload, and reaches these over localhost. In a deployment the same code
# talks to S3 and SQS instead, and the only thing that changes is whether S3_ENDPOINT
# and SQS_ENDPOINT are set.
#
# These three also exist on this machine as standalone containers, `ips-postgres`,
# `ips-minio` and `ips-sqs`. They use the same ports, so run one set or the other, not
# both - and `docker start ips-postgres ips-minio ips-sqs` is the shorter route when
# they are already there.
name: image-processing-service

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: image_processing
      POSTGRES_USER: ips
      POSTGRES_PASSWORD: ips
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ips -d image_processing']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # MinIO starts with nothing in it and the application never creates a bucket, so one
  # is made here. It retries until MinIO is listening and then exits.
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/image-processing-originals;
      "

  # SQS. Both queues, the transformations queue and its dead-letter queue, are created
  # by the application on first use, so this needs no setup beyond the port.
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - '9324:9324'
      - '9325:9325'
    volumes:
      - elasticmq-data:/data

volumes:
  postgres-data:
  minio-data:
  elasticmq-data:
